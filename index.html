<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomodachi Life</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Life sim</p>
          <h1>Tomodachi Life</h1>
        </div>
        <div class="topbar-stats">
          <div class="stat-pill"><span>Day</span><strong id="dayCounter">1</strong></div>
          <div class="stat-pill"><span>Town</span><strong>Sunset Bay</strong></div>
          <div class="stat-pill"><span>Money</span><strong id="moneyCounter">$200</strong></div>
        </div>
      </header>

      <main class="layout">
        <aside class="panel sidebar">
          <h2>Create a resident</h2>
          <form id="characterForm" class="character-form">
            <label>
              Name
              <input id="nameInput" type="text" maxlength="18" value="Aiko" required />
            </label>

            <label>
              Personality
              <select id="personalityInput">
                <option value="Happy">Happy</option>
                <option value="Shy">Shy</option>
                <option value="Energetic">Energetic</option>
                <option value="Creative">Creative</option>
                <option value="Calm">Calm</option>
                <option value="Goofy">Goofy</option>
              </select>
            </label>

            <label>
              Favorite activity
              <select id="hobbyInput">
                <option value="Drawing">Drawing</option>
                <option value="Sports">Sports</option>
                <option value="Music">Music</option>
                <option value="Reading">Reading</option>
                <option value="Cooking">Cooking</option>
                <option value="Games">Games</option>
              </select>
            </label>

            <label>
              Mood color
              <input id="colorInput" type="color" value="#ff9ecf" />
            </label>

            <button type="submit">Add resident</button>
          </form>

          <div class="mini-panel">
            <h3>Town controls</h3>
            <button id="nextDayBtn" class="main-btn">Next day</button>
            <button id="pauseBtn" class="secondary-btn" id="pauseToggle">Pause</button>
            <button id="saveBtn" class="secondary-btn">Save game</button>
            <button id="resetBtn" class="danger-btn">Reset town</button>
          </div>
        </aside>

        <section class="panel main-stage">
          <div class="stage-header">
            <div>
              <p class="eyebrow">Town map</p>
              <h2>Daily life</h2>
            </div>
          </div>

          <div class="map-tabs">
            <button class="map-tab active" data-zone="plaza">Plaza</button>
            <button class="map-tab" data-zone="park">Park</button>
            <button class="map-tab" data-zone="cafe">Cafe</button>
            <button class="map-tab" data-zone="beach">Beach</button>
          </div>

          <div id="gameCanvas" class="canvas-container"></div>
        </section>

        <aside class="panel detail-panel">
          <div id="selectedCharacterPanel" class="selected-card">
            <p class="eyebrow">Selected resident</p>
            <h2>Click on a resident</h2>
          </div>
        </aside>
      </main>
    </div>

    <template id="thoughtBubbleTemplate">
      <div class="thought-bubble">
        <p id="thoughtText"></p>
      </div>
    </template>

    <script src="script.js"></script>
  </body>
</html>
